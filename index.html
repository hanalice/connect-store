<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CONNECT</title>
        <script nonce="$request_id">
            (function () {
                try {
                    const prefs = localStorage.getItem('clo-user-preferences');
                    if (prefs) {
                        const { state } = JSON.parse(prefs);
                        if (state && state.theme) {
                            document.documentElement.setAttribute('data-theme', state.theme);
                        }
                    }
                } catch (e) {}
            })();
        </script>
        <style>
            :root {
                --color-bg-page: #0f1115;
            }

            :root[data-theme='light'] {
                --color-bg-page: #eef2f7;
            }

            body {
                background-color: var(--color-bg-page);
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            #root:not(:empty) {
                overflow: visible;
            }

            .app-loading-container {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: var(--color-bg-page);
                z-index: 100;
            }

            .loading-spinner {
                width: 80px;
                height: 80px;
                animation: spin 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
                filter: drop-shadow(0 0 15px rgba(88, 214, 174, 0.3));
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <div id="root">
            <div class="app-loading-container">
                <svg
                    class="loading-spinner"
                    viewBox="0 0 32 32"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <defs>
                        <linearGradient
                            id="brandGradient"
                            x1="0"
                            y1="0"
                            x2="32"
                            y2="32"
                            gradientUnits="userSpaceOnUse"
                        >
                            <stop offset="0%" stop-color="#58d6ae" />
                            <stop offset="100%" stop-color="#3fb1f5" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="1.2" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <path
                        d="M23 9C21.2 6.5 18.8 5.5 16 5.5C10.2 5.5 5.5 10.2 5.5 16C5.5 21.8 10.2 26.5 16 26.5C18.8 26.5 21.2 25.5 23 23"
                        stroke="url(#brandGradient)"
                        stroke-width="4"
                        stroke-linecap="round"
                        filter="url(#glow)"
                    />
                    <circle cx="16" cy="16" r="4" fill="url(#brandGradient)" />
                </svg>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
